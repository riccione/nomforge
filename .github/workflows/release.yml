---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CLI_BIN: nomforge-cli
  GUI_BIN: nomforge-gui

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@01dfa0fde5eb92e5143cb580b9cf66e09f3e56e7
    with:
      tag: ${{ github.ref_name }}
      bin_names: "nomforge-cli nomforge-gui"
      apt_packages: "libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libatk1.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev"
      use_upx: true
      cargo_args: "--locked"
    secrets: inherit
